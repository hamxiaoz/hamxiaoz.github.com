<style>
/* ══ /work redesign mockups — shared styles (switcher, page header, role rows) ══ */

/* Mockup switcher chrome (dashed = not part of the design) */
.theme-zurassic .wv-switch {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  font-family: var(--t-font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--t-text-dim);
  border: 1px dashed var(--t-border-strong);
  border-radius: 8px;
  padding: 8px 14px;
  margin-bottom: 48px;
}
.theme-zurassic .wv-switch-label { margin-right: 8px; color: var(--t-text-mid); }
.theme-zurassic .wv-switch a {
  color: var(--t-text-dim);
  padding: 2px 10px;
  border-radius: 100px;
  transition: color 0.15s;
}
.theme-zurassic .wv-switch a:hover { color: var(--t-text); }
.theme-zurassic .wv-switch a.active { background: var(--t-text); color: var(--t-bg); }

/* Page header */
.theme-zurassic .wv-header { margin-bottom: 40px; }
.theme-zurassic .wv-title {
  font-family: var(--t-font-sans);
  font-size: clamp(44px, 7vw, 84px);
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1;
  color: var(--t-text);
  margin: 0 0 18px;
}
.theme-zurassic .wv-title em {
  font-style: normal;
  color: var(--t-accent);
}
.theme-zurassic .wv-intro {
  font-size: 15px;
  color: var(--t-text-mid);
  line-height: 1.6;
  max-width: 520px;
  margin: 0;
}

/* Typographic career row */
.theme-zurassic .wv-role {
  position: relative;
  display: grid;
  grid-template-columns: minmax(90px, 140px) 1fr;
  gap: 8px 40px;
  padding: 52px 0;
  border-top: 1px solid var(--t-border);
}

  content: '';
  position: absolute;

  pointer-events: none;
}
.theme-zurassic .wv-role-num {
  font-family: var(--t-font-mono);
  font-size: clamp(56px, 8vw, 96px);
  font-weight: 700;
  line-height: 0.9;
  color: transparent;
  -webkit-text-stroke: 1.5px var(--t-border-strong);
  user-select: none;
}
@supports not (-webkit-text-stroke: 1px black) {

}
.theme-zurassic .wv-role-eyebrow {

}

  font-size: 14px;
  color: var(--t-text-mid);
  line-height: 1.65;
  max-width: 640px;
}
.theme-zurassic .wv-role-bullets ul {
  margin: 0;
  padding: 0;
  list-style: none;
}
.theme-zurassic .wv-role-bullets li {
  position: relative;
  padding-left: 18px;

}
.theme-zurassic .wv-role-bullets li::before {

  letter-spacing: 0.08em;

  .theme-zurassic .wv-role-num { font-size: 44px; }
  .theme-zurassic .wv-role::after { display: none; }
}

/* Section header — logo, company, hairline rule, role/period on one row */
.theme-zurassic .wv-head {
  display: flex;
  align-items: baseline;
  gap: 16px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--t-border-strong);
  margin-bottom: 24px;
}
.theme-zurassic .wv-head-logo {
  margin-bottom: 0;
  flex-shrink: 0;
  align-self: center;
}
/* Scoped under .wv-head so it beats the later, equally specific .wv-logo img rule */
.theme-zurassic .wv-head .wv-head-logo img { height: 24px; max-width: 120px; }
.theme-zurassic .wv-head-title {
  font-family: var(--t-font-sans);
  font-size: clamp(26px, 3.2vw, 40px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.05;
  color: var(--t-text);
  margin: 0;
}
.theme-zurassic .wv-head-rule {
  flex: 1;
  height: 1px;
  background: var(--t-border);
  min-width: 20px;
}
.theme-zurassic .wv-head-meta {
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex-shrink: 0;
}
@media (max-width: 860px) {
  .theme-zurassic .wv-head { flex-wrap: wrap; gap: 8px 14px; }
  .theme-zurassic .wv-head-rule { display: none; }
}

/* ── Header variants (A stack / B inline / C plaque) ─────────────────────
   Shared bits: role in mono accent micro-type, no floating right-hand text. */
.theme-zurassic .wv-head-role,
.theme-zurassic .wv-head-period {
  font-family: var(--t-font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--t-accent);
  margin: 0;
}
.theme-zurassic .wv-head-period { color: var(--t-text-dim); }

/* A and B put the logo on the right, so the name sets the left edge with the
   body copy below it. Markup has the logo first, hence the order swap. */
.theme-zurassic .wv-head--stack .wv-head-title,
.theme-zurassic .wv-head--inline .wv-head-title { font-size: clamp(21px, 2.3vw, 28px); }
.theme-zurassic .wv-head--stack .wv-head-logo,
.theme-zurassic .wv-head--inline .wv-head-logo { order: 2; margin-bottom: 0; flex-shrink: 0; }
/* Text takes the remaining space and wraps inside itself, so the logo stays on
   the first row at every width. Basis must be 0, not auto: a wrapping flex
   container breaks the line on base sizes before it ever shrinks an item. */
.theme-zurassic .wv-head--stack .wv-head-text,
.theme-zurassic .wv-head--inline .wv-head-text {
  order: 1;
  flex: 1 1 0;
  min-width: 0;
}

/* A — Stack: company over role on the left, logo held right */
.theme-zurassic .wv-head--stack {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px 24px;
  flex-wrap: wrap;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--t-border-strong);
  margin-bottom: 28px;
}
.theme-zurassic .wv-head--stack .wv-head-logo img { height: 26px; max-width: 130px; }
.theme-zurassic .wv-head--stack .wv-head-title { margin-bottom: 6px; }

/* B — Inline: name and role on one line, logo held right */
.theme-zurassic .wv-head--inline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px 16px;
  flex-wrap: wrap;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--t-border-strong);
  margin-bottom: 28px;
}
.theme-zurassic .wv-head--inline .wv-head-logo img { height: 24px; max-width: 120px; }
.theme-zurassic .wv-head--inline .wv-head-text {
  display: flex;
  align-items: baseline;
  gap: 18px;
  flex-wrap: wrap;
}
.theme-zurassic .wv-head--inline .wv-head-role {
  position: relative;
  padding-left: 20px;
}
.theme-zurassic .wv-head--inline .wv-head-role::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0.1em;
  height: 1.05em;
  width: 1px;
  background: var(--t-border-strong);
}

/* D — Label: the section-label device (dot + mono caps + rule) as the header.
   The company reads as an eyebrow; the role carries the heading weight in the
   text column below. */
.theme-zurassic .wv-head--label {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 0;
  border-bottom: none;
  margin-bottom: 24px;
}
.theme-zurassic .wv-head--label .wv-head-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--t-accent);
  flex-shrink: 0;
}
.theme-zurassic .wv-head--label .wv-head-title {
  font-family: var(--t-font-mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--t-text);
  white-space: nowrap;
  margin: 0;
}
.theme-zurassic .wv-head--label .wv-head-logo { margin-bottom: 0; flex-shrink: 0; }
/* Brand chips are all 260x91, so a fixed height gives every logo the same box */
.theme-zurassic .wv-head--label .wv-head-logo img {
  height: 26px;
  max-width: none;
  border-radius: 3px;
}
@media (max-width: 700px) {
  /* Long names (ADP) would overflow a nowrap label at this width */
  .theme-zurassic .wv-head--label { flex-wrap: wrap; }
  .theme-zurassic .wv-head--label .wv-head-title { white-space: normal; }
  .theme-zurassic .wv-head--label .wv-head-rule { display: none; }
  .theme-zurassic .wv-head--label .wv-head-logo { margin-left: auto; }
}

/* C — Plaque: logo in a chip, name and role contained in a glass band */
.theme-zurassic .wv-head--plaque {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 18px 24px;
  background: var(--t-surface);
  border: 1px solid var(--t-border);
  border-left: 3px solid var(--t-accent);
  border-radius: var(--t-radius);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  margin-bottom: 30px;
}
.theme-zurassic .wv-head--plaque .wv-head-logo {
  margin-bottom: 0;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 60px;
  height: 60px;
  background: #fff;
  border: 1px solid var(--t-border);
  border-radius: 12px;
}
.theme-zurassic .wv-head--plaque .wv-head-logo img {
  height: 26px;
  max-width: 44px;
  object-fit: contain;
}
.theme-zurassic .wv-head--plaque .wv-head-title {
  font-size: clamp(24px, 2.8vw, 34px);
  margin-bottom: 6px;
}

@media (max-width: 700px) {
  .theme-zurassic .wv-head--plaque { padding: 16px 18px; gap: 14px; }
  .theme-zurassic .wv-head--plaque .wv-head-logo { width: 46px; height: 46px; }
  .theme-zurassic .wv-head--plaque .wv-head-logo img { height: 20px; max-width: 32px; }
}

/* Company logo mark — fixed height, natural width (wordmarks run wide,
   icon marks are square), so every section sits on the same optical baseline. */
.theme-zurassic .wv-logo {
  display: block;
  margin-bottom: 18px;
}
.theme-zurassic .wv-logo img {
  height: 30px;
  width: auto;
  max-width: 160px;
  object-fit: contain;
  display: block;
}

/* Featured "shipped product" hero — same hover zoom as the grid tiles */
.theme-zurassic .wv-hero {
  display: block;
}
.theme-zurassic .wv-hero-frame {
  display: block;
  overflow: hidden;
  border-radius: var(--t-radius);
  border: 1px solid var(--t-border);
  background: #fff;
  margin-bottom: 12px;
}
.theme-zurassic .wv-hero-frame img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  display: block;
  transition: transform 0.35s cubic-bezier(0.2, 0.6, 0.2, 1);
}
.theme-zurassic .wv-hero:hover .wv-hero-frame img { transform: scale(1.04); }
.theme-zurassic .wv-hero-label {
  display: block;
  font-family: var(--t-font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--t-accent);
  margin-bottom: 4px;
}
.theme-zurassic .wv-hero-title {
  display: block;
  font-family: var(--t-font-sans);
  font-size: 15px;
  font-weight: 600;
  color: var(--t-text);
  transition: color 0.15s;
}
.theme-zurassic .wv-hero:hover .wv-hero-title { color: var(--t-accent); }
.theme-zurassic .wv-hero-desc {
  display: block;
  font-size: 13px;
  color: var(--t-text-mid);
  line-height: 1.5;
  margin-top: 2px;
}

/* Shared role meta: eyebrow (role + period), highlight bullets, footer */
.theme-zurassic .wv-eyebrow {
  display: flex;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 12px;
  position: relative;
}
.theme-zurassic .wv-rolename {
  font-family: var(--t-font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--t-accent);
}
.theme-zurassic .wv-period {
  font-family: var(--t-font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--t-text-dim);
}
.theme-zurassic .wv-hl {
  font-size: 14.5px;
  color: var(--t-text-mid);
  line-height: 1.65;
  position: relative;
}
.theme-zurassic .wv-hl ul {
  margin: 0;
  padding: 0;
  list-style: none;
}
.theme-zurassic .wv-hl li {
  position: relative;
  padding-left: 20px;
  margin-bottom: 10px;
}
.theme-zurassic .wv-hl li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0.68em;
  width: 10px;
  height: 1px;
  background: var(--t-accent);
}
.theme-zurassic .wv-foot {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px 24px;
  margin-top: 24px;
  position: relative;
}
.theme-zurassic .wv-foot .wv-role-tags { margin-top: 0; }

/* Shared product gallery grid (work-gallery.html) */
.theme-zurassic .wv-gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 24px 16px;
  margin-bottom: 80px;
}
.theme-zurassic .wv-gtile { display: block; }
.theme-zurassic .wv-gtile-img {
  display: block;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  border-radius: var(--t-radius);
  border: 1px solid var(--t-border);
  margin-bottom: 12px;
  background: var(--t-surface);
}
.theme-zurassic .wv-gtile-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.35s cubic-bezier(0.2, 0.6, 0.2, 1);
}
.theme-zurassic .wv-gtile:hover .wv-gtile-img img { transform: scale(1.04); }
/* Item with no screenshot (e.g. a training programme) keeps the grid rhythm */
.theme-zurassic .wv-gtile-img--empty {
  background-image: radial-gradient(circle, rgba(0,0,0,0.07) 1px, transparent 1px);
  background-size: 10px 10px;
}
.theme-zurassic .wv-gtile-title {
  display: block;
  font-family: var(--t-font-sans);
  font-size: 14px;
  font-weight: 600;
  color: var(--t-text);
  margin-bottom: 3px;
  transition: color 0.15s;
}
.theme-zurassic .wv-gtile:hover .wv-gtile-title { color: var(--t-accent); }
.theme-zurassic .wv-gtile-co {
  display: block;
  font-family: var(--t-font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--t-text-dim);
}
/* ── Count-aware gallery sizing ──────────────────────────────────────────
   A company with 1-2 shipped products should show them large enough to fill
   the row; only a long list (AEM) earns small thumbnails. */
.theme-zurassic .wv-gallery--n1,
.theme-zurassic .wv-gallery--n2,
.theme-zurassic .wv-gallery--n3 { gap: 24px; }
.theme-zurassic .wv-gallery--n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.theme-zurassic .wv-gallery--n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.theme-zurassic .wv-gallery--n1 { grid-template-columns: minmax(0, 1fr); }

/* Aspect ratio lives on the wrapper span (the img is height:100%), so it has to
   be overridden there — setting it on the img has no effect. */
.theme-zurassic .wv-gallery--n1 .wv-gtile-img,
.theme-zurassic .wv-gallery--n2 .wv-gtile-img,
.theme-zurassic .wv-gallery--n3 .wv-gtile-img {
  margin-bottom: 14px;
  aspect-ratio: 16 / 10;
}

/* A single product becomes a feature row: image left, name and blurb right,
   so the section fills its width without a stranded tile. */
.theme-zurassic .wv-gallery--n1 .wv-gtile {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  column-gap: 36px;
  align-items: center;
}
.theme-zurassic .wv-gallery--n1 .wv-gtile-img {
  grid-column: 1;
  grid-row: 1 / span 2;
  margin-bottom: 0;
}
.theme-zurassic .wv-gallery--n1 .wv-gtile-title {
  grid-column: 2;
  align-self: end;
  font-size: 19px;
  margin-bottom: 6px;
}
.theme-zurassic .wv-gallery--n1 .wv-gtile-desc {
  grid-column: 2;
  align-self: start;
  -webkit-line-clamp: 4;
  font-size: 14px;
}
@media (max-width: 700px) {
  .theme-zurassic .wv-gallery--n2,
  .theme-zurassic .wv-gallery--n3 { grid-template-columns: minmax(0, 1fr); }
  .theme-zurassic .wv-gallery--n1 .wv-gtile {
    grid-template-columns: minmax(0, 1fr);
    row-gap: 12px;
  }
  .theme-zurassic .wv-gallery--n1 .wv-gtile-img { grid-column: 1; grid-row: 1; }
  .theme-zurassic .wv-gallery--n1 .wv-gtile-title,
  .theme-zurassic .wv-gallery--n1 .wv-gtile-desc { grid-column: 1; }
}

/* Sentence-case caption — for tiles already grouped under their company */
.theme-zurassic .wv-gtile-desc {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--t-text-mid);
}

/* Shared awards strip (work-awards.html) */
.theme-zurassic .wv-awards {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 720px;
}
.theme-zurassic .wv-award {
  display: grid;
  grid-template-columns: 48px 1fr auto;
  align-items: center;
  gap: 16px;
  padding: 12px 20px 12px 12px;
}
.theme-zurassic .wv-award-thumb {
  display: block;
  width: 48px;
  height: 48px;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--t-border);
  background: var(--t-surface);
}
.theme-zurassic .wv-award-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.theme-zurassic .wv-award-thumb--empty {
  background-image: radial-gradient(circle, rgba(0,0,0,0.08) 1px, transparent 1px);
  background-size: 8px 8px;
}
.theme-zurassic .wv-award-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.theme-zurassic .wv-award-title {
  font-family: var(--t-font-sans);
  font-size: 14px;
  font-weight: 600;
  color: var(--t-text);
}
.theme-zurassic .wv-award-desc {
  font-size: 12.5px;
  color: var(--t-text-mid);
  line-height: 1.5;
}
.theme-zurassic .wv-award-go {
  font-size: 16px;
  color: var(--t-text-dim);
  transition: color 0.15s, transform 0.2s;
}
.theme-zurassic .wv-award:hover .wv-award-go {
  color: var(--t-accent);
  transform: translateX(3px);
}

/* Placeholder frame for missing product shots */
.theme-zurassic .wv-ph {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px dashed var(--t-border-strong);
  border-radius: var(--t-radius);
  background-image: radial-gradient(circle, rgba(0,0,0,0.05) 1px, transparent 1px);
  background-size: 10px 10px;
}
.theme-zurassic .wv-ph-label {
  font-family: var(--t-font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--t-text-dim);
  text-align: center;
  padding: 12px;
}
</style>
