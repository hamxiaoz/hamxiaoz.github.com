{{ $url := .Get "url" }}
{{ $label := .Get "label" }}
{{ $caption := .Get "caption" | default "Try it in your browser" }}
<div class="app-callout">
  <a class="app-link" href="{{ $url }}" target="_blank" rel="noopener noreferrer">
    <span class="app-link__icon">↗</span>
    <span class="app-link__stack">
      <span class="app-link__title">{{ $label }}</span>
      <span class="app-link__caption">{{ $caption }}</span>
    </span>
  </a>
</div>
